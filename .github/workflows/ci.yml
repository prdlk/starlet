name: CI

on:
  # push:
  # branches: [main]
  # pull_request:
  workflow_dispatch:

# A force-push or a new commit on an open PR makes the in-flight run worthless.
# Cancel it rather than pay for three platforms of cold Rust builds twice.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  lint:
    name: lint (fmt + clippy)
    # Single platform on purpose: rustfmt output and clippy lints are decided by
    # the pinned toolchain, not by the host OS, so a matrix here buys nothing.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # clippy type-checks the whole workspace, which means every -sys crate's
      # build script still has to run and every native library still has to link.
      - uses: ./.github/actions/linux-deps

      # No toolchain is named anywhere in this workflow. rust-toolchain.toml pins
      # channel 1.98.0 plus rustfmt and clippy, and rustup applies that override
      # automatically for any cargo/rustc call inside the checkout. Naming a
      # toolchain in a setup action (for example dtolnay/rust-toolchain@stable)
      # would install a second toolchain that the override then ignores, or worse,
      # silently shadow the pin. This step exists only to make the download an
      # explicit, separately-timed line in the log. Since rustup 1.28 a bare
      # `rustup show` no longer installs a missing override toolchain, hence the
      # `|| rustup toolchain install` fallback, which reads rust-toolchain.toml.
      - name: Install pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      # --all-targets also lints tests, benches and crates/store/examples/seed.rs,
      # which are exactly the places unreviewed code tends to accumulate.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # A macOS-only or Windows-only linking failure is the most likely kind of
      # breakage in this workspace; stopping at the first one hides the rest.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      # macOS and Windows link against system frameworks that ship with the
      # runner image (and keyring uses apple-native / windows-native there), so
      # only Linux needs packages installed.
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-deps

      # Same reasoning as the lint job: let rustup honour rust-toolchain.toml.
      - name: Install pinned toolchain from rust-toolchain.toml
        shell: bash
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup show

      - uses: Swatinem/rust-cache@v2
        with:
          # Keep one cache per platform. Target directories are not portable
          # across OSes and a shared key would thrash on every run.
          key: ${{ matrix.os }}

      # crates/ui's dev-dependencies enable gpui's `test-support` feature, which
      # substitutes a headless platform layer. Nothing opens a real window or a
      # real Vulkan device, so there is no need for xvfb or a software renderer.
      - name: cargo test
        run: cargo test --workspace --locked

      # cargo test never builds the `starlet` binary itself (crates/app has no
      # tests), so a break in main.rs would otherwise reach main unnoticed.
      - name: cargo build
        run: cargo build --workspace --locked
