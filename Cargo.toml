[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/ui",
    "crates/core",
    "crates/store",
    "crates/sync",
    "crates/ai",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/prdlk/starlet"

[workspace.dependencies]
starlet-ai = { path = "crates/ai" }
starlet-core = { path = "crates/core" }
starlet-store = { path = "crates/store" }
starlet-sync = { path = "crates/sync" }
starlet-ui = { path = "crates/ui" }

gpui = "0.2.2"
gpui-component = "0.5.1"

anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde", "std"] }
directories = "6.0.0"
futures = "0.3.34"
keyring = { version = "3.6.3", features = ["apple-native", "windows-native", "sync-secret-service"] }
nucleo = "0.5.0"
open = "5.4.2"
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"

# dev
insta = "1.48.0"
proptest = "1.11.0"
tempfile = "3.27.0"
wiremock = "0.6.5"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
